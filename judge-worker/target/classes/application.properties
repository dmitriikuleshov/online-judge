# Server Configuration
server.port=8081
spring.application.name=judge-worker

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/onlinejudge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:judge}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:judge123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# RabbitMQ Configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:judge}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:judge123}

# Logging
logging.level.com.judge.worker=INFO
logging.level.org.springframework.amqp=DEBUG